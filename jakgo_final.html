<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JakGo! — Peta Transjakarta Interaktif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:#12408f;
    --brand-dark:#0c2d69;
    --paper:#f5f2ea;
    --card:#ffffff;
    --field:#faf8f2;
    --ink:#1b1f2a;
    --muted:#5f6573;
    --line:#d8d2c3;
    --sky:#1f6fe0;
    --yellow:#f2c318;
    --green:#1a9a5c;
    --red:#d9304a;
    font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;font-variant-numeric:tabular-nums}

  /* ===== Header ===== */
  header{
    display:flex;align-items:center;gap:16px;
    padding:8px 22px;background:var(--brand);color:#fff;
    border-bottom:4px solid var(--yellow);
  }
  .brand{height:56px;width:auto;display:block;flex:none}
  .head-title{border-left:1px solid rgba(255,255,255,.28);padding-left:16px}
  header h1{font-size:18px;font-weight:700;margin:0}
  header p{margin:3px 0 0;font-size:12.5px;color:rgba(255,255,255,.78)}
  .header-right{margin-left:auto;display:flex;font-size:12.5px;color:rgba(255,255,255,.78)}
  .hstat{padding:0 14px;border-left:1px solid rgba(255,255,255,.22)}
  .hstat:first-child{border-left:0}
  .hstat b{color:#fff;font-weight:700}

  /* ===== Layout ===== */
  main{flex:1;display:grid;grid-template-columns:384px 1fr;min-height:0}
  aside{border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;min-height:0}
  .panel-scroll{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
  .panel-scroll::-webkit-scrollbar{width:8px}
  .panel-scroll::-webkit-scrollbar-thumb{background:#cbc4b3;border-radius:8px}

  /* ===== Form ===== */
  .planner{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px}
  .planner h2{margin:0 0 14px;font-size:15px;font-weight:700}
  .field{position:relative;display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .dot{width:12px;height:12px;flex:none;border:3px solid;background:#fff;border-radius:50%}
  .dot.a{border-color:var(--green)}
  .dot.b{border-color:var(--red);border-radius:2px}
  .field input{
    flex:1;background:var(--field);color:var(--ink);
    border:1.5px solid #cfc8b6;border-radius:6px;padding:11px 30px 11px 12px;font:inherit;font-size:14px;outline:none;
  }
  .field input::placeholder{color:#8b8f99}
  .field input:focus,.field.active input{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .field .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:17px;padding:4px;display:none;line-height:1}
  .field input:not(:placeholder-shown) ~ .clear{display:block}
  .suggest{
    position:absolute;left:22px;right:0;top:calc(100% + 4px);z-index:30;
    background:#fff;border:1px solid var(--line);border-radius:6px;
    max-height:230px;overflow:auto;box-shadow:0 6px 16px rgba(27,31,42,.14);display:none;
  }
  .suggest.open{display:block}
  .suggest button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 12px;font:inherit;font-size:13.5px;cursor:pointer}
  .suggest button:hover,.suggest button.hl{background:#f1eee5}
  .suggest .kor{display:inline-flex;gap:3px;margin-left:auto}
  .rowbtn{display:flex;gap:8px;align-items:center;margin-top:14px}
  .btn{border:0;border-radius:6px;padding:11px 14px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.primary{flex:1;background:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-dark)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#f1eee5}
  .btn.icon{padding:10px;width:40px;display:grid;place-items:center}

  /* ===== Hasil ===== */
  .result{display:none;flex-direction:column;gap:16px}
  .result.show{display:flex}
  .trip{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .trip-od{padding:14px 16px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
  .od-row{display:flex;gap:12px;align-items:center}
  .od-row small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
  .od-row b{font-size:15px;font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
  .stat{padding:12px 4px;text-align:center;border-right:1px solid var(--line)}
  .stat:last-child{border-right:0}
  .stat b{display:block;font-size:19px;font-weight:800}
  .stat span{font-size:11px;color:var(--muted)}
  .stat.fare b{color:#0b6b42}
  .steps{padding:16px 16px 18px}
  .step{display:grid;grid-template-columns:26px 1fr;gap:10px;padding-bottom:16px}
  .step:last-child{padding-bottom:0}
  .step .bar{width:6px;margin:4px 0 0 10px;border-radius:3px;background:var(--c,#999);position:relative}
  .step .bar.dashed{background:repeating-linear-gradient(180deg,var(--c) 0 5px,transparent 5px 10px)}
  .step .bar::before{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#fff;border:3.5px solid var(--c)}
  .step:last-child .bar{background:transparent}
  .step:last-child .bar::before{border-radius:3px;background:var(--ink);border-color:var(--ink)}
  .step .title{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .step .desc{font-size:12.5px;color:#4b5060;margin-top:3px;line-height:1.5}
  .step .desc b{color:var(--ink)}
  .badge{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:22px;padding:0 7px;border-radius:4px;background:var(--c,#999);color:#fff;font-size:12px;font-weight:800}
  .badge.light{color:#1a1400}
  .stoplist{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px}
  .stoplist li{font-size:11px;background:var(--field);border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:#4b5060}
  details.stops{margin-top:6px}
  details.stops summary{font-size:12px;color:var(--sky);cursor:pointer;font-weight:600;user-select:none}
  .trip-foot{padding:10px 16px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--field);line-height:1.55}

  /* ===== Di balik layar ===== */
  .why{background:var(--brand-dark);color:#fff;border-radius:8px;padding:16px}
  .why-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .why-head b{font-size:14px;font-weight:700}
  .why-tag{background:var(--yellow);color:#1a1400;font-weight:800;font-size:13px;padding:2px 8px;border-radius:4px}
  .why-grid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid rgba(255,255,255,.22);border-radius:6px}
  .why-grid div{padding:10px 12px;border-right:1px solid rgba(255,255,255,.22)}
  .why-grid div:last-child{border-right:0}
  .why-grid b{display:block;font-size:22px;font-weight:800;line-height:1.1}
  .why-grid b i{font-style:normal;font-size:12px;font-weight:600;opacity:.75;margin-left:3px}
  .why-grid span{font-size:11px;opacity:.75}
  .why-bar{height:8px;background:rgba(255,255,255,.18);border-radius:2px;margin:14px 0 8px;overflow:hidden}
  .why-bar span{display:block;height:100%;background:var(--yellow)}
  .why-note{font-size:12.5px;line-height:1.55;margin:0 0 14px;color:rgba(255,255,255,.88)}
  .why-terms{margin:0;display:grid;gap:10px}
  .why-terms div{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:start}
  .why-terms dt{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-weight:700;color:var(--yellow);font-size:13px}
  .why-terms dd{margin:0;font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.88)}
  .why-formula{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(255,255,255,.3);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:13px;text-align:center}

  /* ===== Pilihan rute ===== */
  .options{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px}
  .options h3{margin:0;font-size:14px;font-weight:700}
  .options .hint{margin:3px 0 10px;font-size:11.5px;color:var(--muted)}
  .opt-list{display:grid;gap:8px}
  .opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:7px;padding:10px 12px;cursor:pointer}
  .opt:hover{background:#f1eee5}
  .opt.sel{background:#f2f6ff;border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
  .opt-top{display:flex;align-items:center;gap:8px}
  .opt-tag{font-size:11px;font-weight:700;color:var(--muted);background:#ebe7da;border-radius:4px;padding:2px 7px}
  .opt-tag.fast{background:var(--yellow);color:#1a1400}
  .opt-time{margin-left:auto;font-size:18px;font-weight:800}
  .opt-time small{font-size:11px;font-weight:600;color:var(--muted);margin-left:2px}
  .opt-mid{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:8px}
  .opt-mid .arr{color:var(--muted);font-size:12px}
  .opt-meta{margin-top:6px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
  .opt-meta .delta{color:#9a5a00;font-weight:700}
  .rt-hit{fill:none;stroke:transparent;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}

  .error{background:#fdecea;border:1px solid #e3a09b;color:#7a1f1a;border-radius:6px;padding:12px 14px;font-size:13px;display:none}
  .error.show{display:block}

  /* ===== Peta ===== */
  .map-wrap{position:relative;min-height:0;overflow:hidden;background:#e8e4d9;cursor:grab;touch-action:none}
  .map-wrap.dragging{cursor:grabbing}
  .stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  .stage img{display:block;width:1600px;height:1455px;user-select:none;-webkit-user-drag:none;pointer-events:none;transition:filter .4s, opacity .4s}
  .stage.routed img{filter:saturate(.3) brightness(1.03) contrast(.9);opacity:.85}
  .stage svg{position:absolute;left:0;top:0;width:1600px;height:1455px;overflow:visible}
  .st{fill:#fff;fill-opacity:.001;stroke:transparent;cursor:pointer}
  .st:hover{fill:#fff;fill-opacity:.9;stroke:var(--ink);stroke-width:2.5}
  .st.on{fill:#fff;fill-opacity:1;stroke:var(--ink);stroke-width:2}
  .rt-casing{fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round}
  .rt{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .rt-walk{fill:none;stroke:var(--ink);stroke-dasharray:4 7;stroke-linecap:round}
  .marker{pointer-events:none}
  .marker circle{stroke:#fff;stroke-width:3}
  .marker .ring{stroke:none;fill-opacity:.22}
  .marker text{font-family:inherit;font-weight:800;font-size:13px;fill:#fff;text-anchor:middle;dominant-baseline:central}
  .rt-stop{fill:#fff;stroke:var(--ink);stroke-width:2;pointer-events:none}

  .tooltip{position:absolute;pointer-events:none;z-index:20;display:none;background:var(--ink);color:#fff;border-radius:6px;padding:8px 10px;font-size:12.5px;white-space:nowrap}
  .tooltip .kor{display:flex;gap:4px;margin-top:5px}
  .tooltip small{color:#b9bfcc;display:block;margin-top:4px}
  .map-tools{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px;z-index:10}
  .map-tools button{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 1px 2px rgba(27,31,42,.15)}
  .map-tools button:hover{background:#f1eee5}
  .map-mode{position:absolute;left:14px;top:14px;z-index:10;display:flex;gap:4px;background:#fff;border-radius:8px;padding:4px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(27,31,42,.15)}
  .map-mode button{border:0;background:transparent;font:inherit;font-weight:600;font-size:12.5px;color:var(--ink);padding:7px 12px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .map-mode button:hover{background:#f1eee5}
  .map-mode button.on{background:var(--brand);color:#fff}
  .map-mode .dot{width:10px;height:10px;border-width:2.5px}
  .toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(16px);opacity:0;z-index:10;background:var(--ink);color:#fff;padding:9px 14px;border-radius:6px;font-size:12.5px;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}

  @media (max-width:860px){
    body{overflow:auto}
    main{grid-template-columns:1fr;grid-template-rows:auto 62vh}
    aside{border-right:0;border-bottom:1px solid var(--line);order:2}
    .map-wrap{order:1}
    .brand{height:44px}
    header{padding:8px 16px}
    header p,.header-right{display:none}
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat:nth-child(2){border-right:0}
    .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  }
  :focus-visible{outline:3px solid var(--sky);outline-offset:2px}
</style>
</head>

  const R=6371, p1=P[0]*Math.PI/180, p2=Q[0]*Math.PI/180, dp=p2-p1, dl=(Q[1]-P[1])*Math.PI/180;
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2; return 2*R*Math.asin(Math.sqrt(x));
}

/* =====================================================================
   A*  — state = (halte, koridor terakhir yang dinaiki)
   ===================================================================== */
class MinHeap{
  constructor(){this.a=[]}
  push(x){this.a.push(x);let i=this.a.length-1;while(i>0){const p=(i-1)>>1;if(this.a[p].f<=this.a[i].f)break;[this.a[p],this.a[i]]=[this.a[i],this.a[p]];i=p;}}
  pop(){const t=this.a[0],l=this.a.pop();if(this.a.length){this.a[0]=l;let i=0;for(;;){let L=2*i+1,R=L+1,m=i;if(L<this.a.length&&this.a[L].f<this.a[m].f)m=L;if(R<this.a.length&&this.a[R].f<this.a[m].f)m=R;if(m===i)break;[this.a[m],this.a[i]]=[this.a[i],this.a[m]];i=m;}}return t;}
  get size(){return this.a.length}
}
function astar(start, goal, opt={}){
  const TM = opt.tmul ?? 1, PEN = opt.pen || null;    // TM: pengali waktu tunggu (dipakai untuk mencari alternatif)
  const h = n => geoKm(n,goal)/VMAX_KM_PER_MIN;       // heuristik: jarak garis lurus (stops.txt) ÷ kecepatan tercepat di GTFS → admissible
  const open = new MinHeap();
  const g = new Map(), came = new Map(), closed = new Set();
  const key = (n,c)=>n+"|"+c;
  const s0 = key(start,"-");
  g.set(s0,0); open.push({n:start,c:"-",f:h(start)});
  let expanded = 0;
  while(open.size){
    const cur = open.pop();
    const ck = key(cur.n,cur.c);
    if(closed.has(ck)) continue;
    closed.add(ck); expanded++;
    if(cur.n===goal){
      // rekonstruksi jalur
      const path=[]; let k=ck;
      while(k){ const [n,c]=k.split("|"); path.push({n,c}); k=came.get(k); }
      path.reverse();
      return {path, cost:g.get(ck), expanded};
    }
    for(const e of (adj[cur.n]||[])){
      let w = e.w;
      if(PEN){ const m = PEN.get(edgeKey(cur.n,e.to,e.cor)); if(m) w *= m; }
      const bc = cur.c.replace(/^W/,"");               // koridor bus terakhir (abaikan penanda jalan kaki)
      let stateCor;
      if(e.cor==="W"){ stateCor = "W"+bc; }            // jalan kaki: koridor "aktif" tetap
      else { if(bc!==e.cor) w += waitMin(e.cor)*TM; stateCor = e.cor; }   // naik pertama & tiap transit: tunggu headway/2
      const nk = key(e.to,stateCor);
      const ng = g.get(ck)+w;
      if(ng < (g.get(nk) ?? Infinity)){
        g.set(nk,ng); came.set(nk,ck);
        open.push({n:e.to,c:stateCor,f:ng+h(e.to)});
      }
    }
  }
  return null;
}
// ubah jalur menjadi segmen per koridor
function buildSegments(path){
  const segs=[];
  for(let i=1;i<path.length;i++){
    const from=path[i-1].n, to=path[i].n;
    let cor = path[i].c;
    if(cor.startsWith("W")) cor="W";
    const last=segs[segs.length-1];
    if(last && last.cor===cor && cor!=="W"){ last.stops.push(to); }
    else segs.push({cor, stops:[from,to]});
  }
  return segs;
}

/* =====================================================================
   PILIHAN RUTE — tercepat (A* murni) + alternatif
   Alternatif dicari dengan A* yang sama, tapi (1) penalti transit dibesarkan
   dan (2) ruas yang sudah dipakai rute sebelumnya "dimahalkan".
   Semua kandidat dinilai ulang dengan model waktu yang sama supaya adil.
   ===================================================================== */
const MAX_ROUTES = 3;
function evalPath(path){
  let cost=0;
  for(let i=1;i<path.length;i++){
    const p=path[i-1], q=path[i];
    const isW=q.c.startsWith("W"), cor=isW?"W":q.c;
    const e=(adj[p.n]||[]).find(x=>x.to===q.n && x.cor===cor);
    let w=e.w;
    if(!isW){ const bc=p.c.replace(/^W/,""); if(bc!==cor) w+=waitMin(cor); }
    cost+=w;
  }
  return cost;
}
const routeSig = segs => segs.map(s=>s.cor+":"+s.stops[0]+">"+s.stops[s.stops.length-1]).join("/");
function busEdgeSet(path){
  const set=new Set();
  for(let i=1;i<path.length;i++){ const c=path[i].c; if(c.startsWith("W")) continue; set.add(edgeKey(path[i-1].n,path[i].n,c)); }
  return set;
}
function findRoutes(a,b){
  const run = o => { const t=performance.now(); const r=astar(a,b,o); if(r) r.ms=(performance.now()-t).toFixed(2); return r; };
  const base = run({});
  if(!base) return null;
  const cands = [];
  [2.5,4.5].forEach(tm=>{ const r=run({tmul:tm}); if(r) cands.push(r); });
  const pen = new Map();
  const bump = res => { for(let i=1;i<res.path.length;i++){ const c=res.path[i].c; if(c.startsWith("W")) continue;
      const k=edgeKey(res.path[i-1].n,res.path[i].n,c); pen.set(k,(pen.get(k)||1)*1.8); } };
  bump(base);
  for(let it=0; it<5; it++){ const r=run({pen}); if(!r) break; cands.push(r); bump(r); }

  const prep = (res, alt) => {
    res.cost = evalPath(res.path); res.alt = alt;
    const segs = buildSegments(res.path);
    const busSegs = segs.filter(s=>s.cor!=="W");
    return {res, segs, ms:res.ms, sig:routeSig(segs), edges:busEdgeSet(res.path),
            minutes:Math.round(res.cost), transfers:Math.max(0,busSegs.length-1)};
  };
  const out = [prep(base,false)];
  const limit = base.cost*1.6 + 8;
  cands.map(r=>prep(r,true)).sort((x,y)=>x.res.cost-y.res.cost).forEach(r=>{
    if(out.length>=MAX_ROUTES || r.res.cost>limit) return;
    if(out.some(o=>o.sig===r.sig)) return;
    const tooSimilar = out.some(o=>{
      const small=Math.min(o.edges.size,r.edges.size); if(!small) return true;
      let shared=0; r.edges.forEach(k=>{ if(o.edges.has(k)) shared++; });
      return shared/small > 0.85;
    });
    if(!tooSimilar) out.push(r);
  });
  return out;
}

let mode="from";
function setMode(m){mode=m;$("#mode-from").classList.toggle("on",m==="from");$("#mode-to").classList.toggle("on",m==="to");
  $("#f-from").classList.toggle("active",m==="from");$("#f-to").classList.toggle("active",m==="to");}
$("#mode-from").onclick=()=>setMode("from"); $("#mode-to").onclick=()=>setMode("to");
function pickFromMap(n){
  if(moved) return;
  $("#"+mode).value=n; tooltip.style.display="none";
  toast(`${mode==="from"?"Asal":"Tujuan"}: ${n}`);
  markSelected();
  if(mode==="from") setMode("to"); else setMode("from");
  if($("#from").value && $("#to").value) route();
}
function markSelected(){
  document.querySelectorAll(".st.on").forEach(x=>x.classList.remove("on"));
  [$("#from").value,$("#to").value].forEach(v=>{ if(S[v]) gSt.querySelector(`[data-n="${CSS.escape(v)}"]`).classList.add("on"); });
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1800);}

// ---- autocomplete
function setupSuggest(inputId, boxId){
  const inp=$("#"+inputId), box=$("#"+boxId); let hl=-1;
  const render=()=>{
    const q=inp.value.trim().toLowerCase();
    const list=names.filter(n=>n.toLowerCase().includes(q)).slice(0,40);
    if(!list.length || (list.length===1 && list[0]===inp.value.trim())){box.classList.remove("open");return;}
    box.innerHTML=list.map((n,i)=>`<button type="button" data-n="${n}" class="${i===hl?'hl':''}">${hlText(n,q)}<span class="kor">${[...S[n].corridors].map(c=>badgeHTML(c,true)).join("")}</span></button>`).join("");
    box.classList.add("open");
    box.querySelectorAll("button").forEach(b=>b.addEventListener("mousedown",e=>{e.preventDefault();inp.value=b.dataset.n;box.classList.remove("open");markSelected();if($("#from").value&&$("#to").value)route();}));
  };
  inp.addEventListener("focus",()=>{setMode(inputId);hl=-1;render();});
  inp.addEventListener("input",()=>{hl=-1;render();});
  inp.addEventListener("blur",()=>setTimeout(()=>box.classList.remove("open"),120));
  inp.addEventListener("keydown",e=>{
    const btns=box.querySelectorAll("button");
    if(e.key==="ArrowDown"){hl=Math.min(btns.length-1,hl+1);render();e.preventDefault();}
    else if(e.key==="ArrowUp"){hl=Math.max(0,hl-1);render();e.preventDefault();}
    else if(e.key==="Enter"){ if(hl>=0&&btns[hl]){inp.value=btns[hl].dataset.n;} box.classList.remove("open"); markSelected(); route(); }
    else if(e.key==="Escape"){box.classList.remove("open");}
  });
}
function hlText(n,q){ if(!q) return n; const i=n.toLowerCase().indexOf(q); return n.slice(0,i)+"<b>"+n.slice(i,i+q.length)+"</b>"+n.slice(i+q.length); }
setupSuggest("from","s-from"); setupSuggest("to","s-to");
document.querySelectorAll(".clear").forEach(b=>b.onclick=()=>{$("#"+b.dataset.for).value="";markSelected();clearRoute();});
$("#swap").onclick=()=>{const a=$("#from").value;$("#from").value=$("#to").value;$("#to").value=a;markSelected();if(a&&$("#from").value)route();};
$("#reset").onclick=()=>{$("#from").value="";$("#to").value="";markSelected();clearRoute();setMode("from");fit();};
$("#go").onclick=route;

function fareNow(){ const d=new Date(); const mins=d.getHours()*60+d.getMinutes(); return (mins>=300 && mins<420)?FARE_EARLY:FARE_NORMAL; }
const rp = n => "Rp"+n.toLocaleString("id-ID");


/* =====================================================================
   HITUNG & GAMBAR RUTE
   ===================================================================== */
function clearRoute(){
  gRt.innerHTML=""; gMk.innerHTML=""; stage.classList.remove("routed");
  $("#result").classList.remove("show"); $("#error").classList.remove("show");
}
function showError(msg){ clearRoute(); const e=$("#error"); e.textContent=msg; e.classList.add("show"); }

function route(){
  const a=$("#from").value.trim(), b=$("#to").value.trim();
  if(!a||!b){ showError("Isi halte asal dan tujuan dulu — ketik namanya atau klik haltenya di peta."); return; }
  if(!S[a]||!S[b]){ showError(`Halte "${!S[a]?a:b}" tidak ada di daftar. Pilih dari saran yang muncul saat mengetik.`); return; }
  if(a===b){ showError("Halte asal dan tujuan sama. Pilih tujuan yang berbeda."); return; }
  const routes=findRoutes(a,b);
  if(!routes){ showError("Rute tidak ditemukan di jaringan peta ini."); return; }
  CUR={routes,sel:0,a,b};
  renderOptions();
  selectRoute(0,true);
  $("#result").scrollIntoView({behavior:"smooth",block:"start"});
}

let CUR={routes:[],sel:0,a:"",b:""};
function selectRoute(i, fitAll){
  CUR.sel=i; const r=CUR.routes[i];
  drawRoutes(fitAll);
  renderTicket(r.res, r.segs, CUR.a, CUR.b, r.ms);
  document.querySelectorAll(".opt").forEach((x,k)=>{ x.classList.toggle("sel",k===i); x.setAttribute("aria-pressed",k===i); });
}

function renderOptions(){
  const R=CUR.routes, fastest=R[0], minT=Math.min(...R.map(r=>r.transfers));
  $("#opt-list").innerHTML = R.map((r,i)=>{
    const chain=r.segs.filter(s=>s.cor!=="W").map(s=>badgeHTML(s.cor,true)).join('<span class="arr">›</span>');
    const tag = i===0 ? '<span class="opt-tag fast">Tercepat</span>'
      : (r.transfers===minT && r.transfers<fastest.transfers ? '<span class="opt-tag">Transit paling sedikit</span>' : `<span class="opt-tag">Alternatif ${i}</span>`);
    const d=Math.round(r.res.cost-fastest.res.cost);
    const delta = i===0 ? "" : `<span class="delta">${d>0?"+"+d+" mnt dari tercepat":"waktu hampir sama"}</span>`;
    return `<button type="button" class="opt" data-i="${i}" aria-pressed="false">
      <div class="opt-top">${tag}<span class="opt-time">≈${r.minutes}<small>mnt</small></span></div>
      <div class="opt-mid">${chain}</div>
      <div class="opt-meta"><span>${r.transfers} transit</span><span>${r.res.path.length-1} halte</span>${delta}</div>
    </button>`;
  }).join("");
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>selectRoute(+b.dataset.i,false));
  $("#options .hint").style.display = R.length>1 ? "" : "none";
  if(R.length===1) $("#opt-list").insertAdjacentHTML("beforeend",'<p class="hint" style="margin:8px 0 0">Tidak ada alternatif yang masuk akal untuk pasangan halte ini — rute tercepat adalah satu-satunya pilihan yang wajar.</p>');
}

function drawRoutes(fitAll){
  gRt.innerHTML=""; gMk.innerHTML=""; stage.classList.add("routed");
  $("#error").classList.remove("show");
  const R=CUR.routes, sel=CUR.sel;
  // urutan gambar: alternatif tak terpilih (bawah) -> tercepat -> rute terpilih (atas)
  const order=R.map((_,i)=>i).filter(i=>i!==0 && i!==sel);
  if(sel!==0) order.push(0);
  order.push(sel);
  order.forEach(i=>{
    // tercepat: tebal & penuh. alternatif terpilih: sedang. alternatif lain: tipis & pudar.
    const st = i===0 ? {cas:17,w:11,op:1,walk:5}
             : i===sel ? {cas:14,w:9,op:1,walk:4}
             : {cas:12,w:7,op:.65,walk:4};
    const g=el("g",{opacity:st.op}); gRt.appendChild(g);
    R[i].segs.forEach(seg=>{
      const pts=seg.stops.map(n=>`${S[n].x},${S[n].y}`).join(" ");
      if(seg.cor==="W"){ g.appendChild(el("polyline",{points:pts,class:"rt-walk","stroke-width":st.walk})); return; }
      const c=CINFO[seg.cor];
      g.appendChild(el("polyline",{points:pts,class:"rt-casing","stroke-width":st.cas}));
      g.appendChild(el("polyline",{points:pts,class:"rt",stroke:c.color,"stroke-width":st.w,"stroke-dasharray":c.dashed?"14 10":"none"}));
      const hit=el("polyline",{points:pts,class:"rt-hit","stroke-width":Math.max(st.cas,18)});
      hit.addEventListener("click",()=>{ if(moved) return; if(CUR.sel!==i) selectRoute(i,false); });
      g.appendChild(hit);
    });
  });
  // titik halte yang dilewati & transit — hanya untuk rute terpilih
  const cur=R[sel];
  cur.res.path.forEach((p,k)=>{
    const s=S[p.n]; if(k===0||k===cur.res.path.length-1) return;
    const isTransfer = cur.segs.some(sg=> sg.stops[0]===p.n);
    gRt.appendChild(el("circle",{cx:s.x,cy:s.y,r:isTransfer?9:5,class:"rt-stop","stroke-width":isTransfer?3:2}));
  });
  const mk=(n,color,label)=>{
    const s=S[n]; const g=el("g",{class:"marker"});
    g.appendChild(el("circle",{cx:s.x,cy:s.y,r:25,class:"ring",fill:color}));
    g.appendChild(el("circle",{cx:s.x,cy:s.y,r:15,fill:color}));
    const t=el("text",{x:s.x,y:s.y+1}); t.textContent=label; g.appendChild(t);
    gMk.appendChild(g);
  };
  mk(CUR.a,"#1fae72","A"); mk(CUR.b,"#ff4d67","B");
  if(fitAll) fitTo(R.flatMap(r=>r.res.path.map(p=>S[p.n])));
}

function dirLabel(cor, from, to){
  const c=CORRIDORS.find(x=>x.id===cor && x.stops.includes(from) && x.stops.includes(to) && !x.loop) || CINFO[cor];
  const st=c.stops; const i=st.indexOf(from), j=st.indexOf(to);
  if(i<0||j<0) return c.name.split(" – ").pop();
  return j>i ? st[st.length-1] : st[0];
}

function segEdges(seg){
  const out=[]; for(let k=1;k<seg.stops.length;k++){ const e=(adj[seg.stops[k-1]]||[]).find(x=>x.to===seg.stops[k]&&x.cor===seg.cor); if(e) out.push(e); } return out;
}
function walkMeters(seg){ const W=WALKS[seg.stops[0]+"~"+seg.stops[1]]||WALKS[seg.stops[1]+"~"+seg.stops[0]]; return W&&W[0]?W[0]:0; }
function renderTicket(res, segs, a, b, ms){
  const busSegs = segs.filter(s=>s.cor!=="W");
  const transfers = Math.max(0, busSegs.length-1);
  const stops = res.path.length-1;
  const minutes = Math.round(res.cost);
  const fare = fareNow();
  $("#r-from").textContent=a; $("#r-to").textContent=b;
  $("#r-time").textContent="≈"+minutes; $("#r-stops").textContent=stops;
  $("#r-transfer").textContent=transfers; $("#r-fare").textContent=rp(fare);

  let html="";
  segs.forEach((seg,i)=>{
    const from=seg.stops[0], to=seg.stops[seg.stops.length-1];
    if(seg.cor==="W"){
      html+=`<div class="step" style="--c:#4b5060"><div class="bar dashed"></div><div class="body">
        <div class="title"><span class="badge" style="--c:#4b5060;padding:0 8px">Jalan kaki</span> ke ${to}</div>
        <div class="desc">Lewat jembatan penghubung dari <b>${from}</b> (±${segEdges(seg).reduce((a,e)=>a+e.w,0).toFixed(1)} menit${walkMeters(seg)?`, ±${walkMeters(seg)} m menurut koordinat halte`:""}, tetap di dalam area halte — tidak perlu tap ulang).</div></div></div>`;
      return;
    }
    const c=CINFO[seg.cor];
    const n=seg.stops.length-1;
    const es = segEdges(seg);
    const segMin = Math.round(es.reduce((a,e)=>a+e.w,0));
    const segKm = es.reduce((a,e)=>a+(e.km||0),0).toFixed(1);
    const est = es.filter(e=>e.src!=="gtfs").length;
    const wait = waitMin(seg.cor).toFixed(1), hwMin = Math.round((HEADWAY[seg.cor]||600)/60);
    const verb = i===0 ? "Naik" : "Transit ke";
    html+=`<div class="step" style="--c:${c.color}"><div class="bar ${c.dashed?'dashed':''}"></div><div class="body">
      <div class="title">${badgeHTML(seg.cor)} ${verb} Koridor ${seg.cor}</div>
      <div class="desc">Dari <b>${from}</b> arah <b>${dirLabel(seg.cor,from,to)}</b>, turun di <b>${to}</b> — ${n} halte, ${segKm} km, ±${segMin} menit di bus + ±${wait} mnt tunggu (headway ${hwMin} mnt)${est?`<br><small>${est} dari ${es.length} ruas bukan ruas langsung GTFS (interpolasi/estimasi)</small>`:""}.</div>
      ${n>1?`<details class="stops"><summary>Lihat ${n-1} halte yang dilewati</summary><ul class="stoplist">${seg.stops.slice(1,-1).map(s=>`<li>${s}</li>`).join("")}</ul></details>`:""}
      </div></div>`;
  });
  html+=`<div class="step" style="--c:#1b1f2a"><div class="bar"></div><div class="body"><div class="title">Tiba di ${b}</div><div class="desc">Tap out di gerbang keluar halte.</div></div></div>`;
  $("#steps").innerHTML=html;

  const allE = segs.flatMap(segEdges), nGtfs = allE.filter(e=>e.src==="gtfs").length;
  $("#r-km").textContent = allE.reduce((a,e)=>a+(e.km||0),0).toFixed(1);
  $("#foot").innerHTML = `Tarif <b>${rp(fare)}</b> flat sekali tap-in (fare_attributes.txt GTFS${fare===FARE_EARLY?"; tarif pagi 05.00–07.00 kebijakan Transjakarta, bukan dari GTFS":""}). Waktu &amp; jarak tiap ruas dari GTFS Transjakarta ${GTFS_META.feed_version} (stop_times.txt, shapes.txt); waktu tunggu = ½ headway (frequencies.txt). ${nGtfs} dari ${allE.length} ruas rute ini adalah ruas GTFS langsung.`;

  const pct = Math.min(100, Math.round(res.expanded/names.length*100));
  $("#astar").innerHTML = `
    <div class="why-head"><span class="why-tag">A*</span><b>Algorithm</b></div>
    <div class="why-grid">
      <div><b>${res.expanded}</b><span>simpul diperluas</span></div>
      <div><b>${ms}<i>ms</i></b><span>waktu hitung</span></div>
      <div><b>${res.cost.toFixed(1)}<i>mnt</i></b><span>total biaya f</span></div>
    </div>
    <div class="why-bar" title="${pct}% dari seluruh halte"><span style="width:${pct}%"></span></div>
    <p class="why-note">Pencarian hanya menyentuh <b>${res.expanded}</b> dari ${names.length} halte (${pct}%). Heuristik mengarahkan langkah lurus ke tujuan, jadi halte yang menjauh tidak perlu diperiksa.${res.alt?" Ini rute <b>alternatif</b>: dicari dengan A* yang sama setelah jalur tercepat diberi penalti (atau penalti transit dibesarkan), jadi tidak dijamin yang tercepat.":""}</p>
    <dl class="why-terms">
      <div><dt>g(n)</dt><dd>Ongkos yang sudah keluar: waktu tempuh antar halte dari stop_times.txt GTFS, ditambah waktu tunggu ½ headway (frequencies.txt) saat naik dan setiap kali pindah koridor.</dd></div>
      <div><dt>h(n)</dt><dd>Tebakan sisa perjalanan: jarak garis lurus ke tujuan (koordinat stops.txt) ÷ kecepatan ruas tercepat di GTFS (${(VMAX_KM_PER_MIN*60).toFixed(0)} km/jam). Tidak pernah lebih besar dari waktu sebenarnya (admissible), jadi hasilnya dijamin optimal.</dd></div>
    </dl>
    <div class="why-formula">f(n) = g(n) + h(n)</div>`;
  $("#result").classList.add("show");
}

</script>
